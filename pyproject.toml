[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neonatal-bilirubin-kramer"
version = "0.2.0"
description = "Qualitative neonatal jaundice distribution documentation and demonstration API"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["kramer", "cli", "enrichment", "simulator"]
packages = ["agents"]
