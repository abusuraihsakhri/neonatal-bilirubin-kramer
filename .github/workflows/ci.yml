name: Test Python and browser application

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile Python
        run: python -m compileall -q agents kramer.py cli.py enrichment.py simulator.py
      - name: Run regression tests
        env:
          AUDIT_SECRET_KEY: ci-only-audit-key-not-for-production-0123456789
        run: pytest -q
      - name: Validate distribution metadata
        run: python -m pip check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Run browser logic tests
        run: node --test tests/browser.test.cjs
      - name: Confirm standalone entry point
        run: |
          test -f index.html
          test -f styles.css
          grep -q 'src="./app.js"' index.html
